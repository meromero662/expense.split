<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Expense</title>
</head>

<body>

    <h1>Edit Expense</h1>

    <form method="POST">

        <label for="person">Who paid?</label>

        <select name="person" id="person" required>

            <option value="Mehrshad"
                {% if expense[1] == "Mehrshad" %}selected{% endif %}>
                Mehrshad
            </option>

            <option value="Shaghayegh"
                {% if expense[1] == "Shaghayegh" %}selected{% endif %}>
                Shaghayegh
            </option>

        </select>

        <br><br>

        <label for="description">What was it?</label>

        <input
            type="text"
            name="description"
            id="description"
            value="{{ expense[2] }}"
            required
        >

        <br><br>

        <label for="amount">Amount (SEK)</label>

        <input
            type="number"
            name="amount"
            id="amount"
            value="{{ expense[3] }}"
            step="0.01"
            min="0"
            required
        >

        <br><br>

        <label for="expense_date">Date</label>

        <input
            type="date"
            name="expense_date"
            id="expense_date"
            value="{{ expense[4] }}"
            required
        >

        <br><br>

        <button type="submit">
            Save Changes
        </button>

        <a href="/">
            Cancel
        </a>

    </form>

</body>

</html>
